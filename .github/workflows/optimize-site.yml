name: Optimize site video

on:
  push:
    branches:
      - main
    paths:
      - 'bg.mp4'
      - 'index.html'
      - 'scripts/polish_site.py'
      - 'scripts/premium_polish.py'
      - 'scripts/cleanup_site.py'
      - '.github/workflows/optimize-site.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate optimized video assets
        run: |
          test -f bg.mp4
          ffmpeg -y -i bg.mp4 -vf "scale='min(1280,iw)':-2,fps=24" -c:v libx264 -preset medium -crf 29 -c:a aac -b:a 96k -movflags +faststart bg-optimized.mp4
          ffmpeg -y -i bg.mp4 -vf "scale='min(1280,iw)':-2,fps=24" -c:v libvpx-vp9 -crf 36 -b:v 0 -c:a libopus -b:a 64k bg-optimized.webm
          ffmpeg -y -i bg.mp4 -vf "scale='min(720,iw)':-2,fps=20" -c:v libx264 -preset medium -crf 32 -c:a aac -b:a 64k -movflags +faststart bg-mobile.mp4
          ffmpeg -y -i bg.mp4 -vf "scale='min(720,iw)':-2,fps=20" -c:v libvpx-vp9 -crf 40 -b:v 0 -c:a libopus -b:a 48k bg-mobile.webm
          ffmpeg -y -i bg.mp4 -vf "scale='min(1280,iw)':-2" -frames:v 1 -q:v 3 bg-poster.jpg

      - name: Polish HTML
        run: |
          python3 scripts/polish_site.py
          python3 scripts/premium_polish.py
          python3 scripts/cleanup_site.py

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bg-optimized.mp4 bg-optimized.webm bg-mobile.mp4 bg-mobile.webm bg-poster.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clean portfolio UI and fix CV controls [skip ci]"
          git push

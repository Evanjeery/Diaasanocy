name: Fix Egypt flag icon

on:
  push:
    paths:
      - '.github/workflows/fix-egypt-flag.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace flag with Egyptian flag SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span class="flag" style="background: linear-gradient(to bottom, #ce1126 33.33%, #fff 33.33%, #fff 66.66%, #000 66.66%);"></span>'
          new = '''<svg class="flag" viewBox="0 0 16 12" role="img" aria-label="Egyptian flag" xmlns="http://www.w3.org/2000/svg"><rect width="16" height="4" fill="#CE1126"/><rect y="4" width="16" height="4" fill="#fff"/><rect y="8" width="16" height="4" fill="#000"/><path fill="#C6A15B" d="M8 4.8c-.9-.55-1.7-.5-2.5-.15l1.2.45-1.55.25 1.35.35L5 6.1l2.15.15L8 7l.85-.75L11 6.1l-1.5-.4 1.35-.35-1.55-.25 1.2-.45C9.7 4.3 8.9 4.25 8 4.8Z"/></svg>'''
          if old not in s:
              raise SystemExit('Expected flag markup was not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix Egyptian flag rendering'
          git push
